version: '3.8'

services:
  redis:
    image: redis:7-alpine
    container_name: spareparts-redis
    ports:
      - "6379:6379"
    environment:
      - REDIS_PASSWORD=spareparts_redis_password
    command: redis-server --requirepass spareparts_redis_password
    volumes:
      - redis_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  redis_data:
    driver: local
